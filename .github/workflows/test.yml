# ============================================================================
#  DriveBuddy — tests on every push and pull request.
#
#  Separate from deploy.yml on purpose: a failing test shows a red cross on the
#  commit but never blocks or undoes a deploy you already made.
#
#    unit   — robot, prices, packages, exports, messages (npm test) + type-check
#    rules  — firestore.rules against the real Firestore emulator, so a rules
#             change that opens a hole (or breaks the app) is caught before you
#             paste it into the Firebase console
# ============================================================================

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and price check
        run: npm run lint
      - name: Unit tests
        run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm --prefix tests/rules ci
      - name: Firestore rules on the emulator
        run: npm --prefix tests/rules test
