# ============================================================================
#  DriveBuddy — build and publish to GitHub Pages on your own domain.
#
#  This is the only file you need. Push it with the rest of the project and
#  GitHub builds the site and serves it at your domain on every commit to main.
#
#  ONE-TIME SETUP (see README, "Deploying from GitHub"):
#    1. Repo → Settings → Pages → Source: "GitHub Actions"
#    2. Repo → Settings → Secrets and variables → Actions → Variables tab →
#       add SITE_DOMAIN = your-domain.in   (no https://, no trailing slash)
#       and the six FIREBASE_* variables below.
#    3. Point your domain's DNS at GitHub (records are in the README).
#
#  The Firebase values are repository *variables*, not secrets, on purpose:
#  Firebase web config is a set of public identifiers that ship in the browser
#  bundle either way. firestore.rules is what protects the data.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy, but never cancels one midway
# through publishing — that would leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Work out where the site will live
        run: |
          if [ -n "${{ vars.SITE_DOMAIN }}" ]; then
            # Custom domain: the site sits at the root, so no path prefix.
            echo "NEXT_PUBLIC_SITE_URL=https://${{ vars.SITE_DOMAIN }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "Publishing to https://${{ vars.SITE_DOMAIN }}"
          else
            # No custom domain: GitHub Pages serves a project repo from a
            # sub-path, e.g. https://user.github.io/repo/. Without the matching
            # basePath every stylesheet and script would 404.
            OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
            REPO="${GITHUB_REPOSITORY#*/}"
            echo "NEXT_PUBLIC_SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
            echo "::notice::SITE_DOMAIN is not set — publishing to https://${OWNER}.github.io/${REPO}/ instead. Set the SITE_DOMAIN variable to use your own domain."
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      - name: Audit the export (SEO, headings, JSON-LD, sitemap)
        run: node scripts/audit.mjs

      - name: Prepare the artifact
        run: |
          # GitHub Pages would otherwise hand the output to Jekyll, which strips
          # every directory beginning with an underscore — including _next/,
          # i.e. all the CSS and JS.
          touch out/.nojekyll

          # Ship the custom domain inside the artifact. Without this, a deploy
          # can clear the custom domain configured in Settings.
          if [ -n "${{ vars.SITE_DOMAIN }}" ]; then
            echo "${{ vars.SITE_DOMAIN }}" > out/CNAME
            echo "CNAME → ${{ vars.SITE_DOMAIN }}"
          else
            echo "::warning::SITE_DOMAIN is not set — deploying to the default github.io URL with placeholder canonical tags."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
